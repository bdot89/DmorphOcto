<!doctype html>
<!-- Source of docs/morphs.jpg (1280x830), from the morph-*.jpg crops of in-game screenshots.
     Render: msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1280,830 --screenshot=morphs.png morphs.html -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fira;src:url(../../../EPLTowers/fonts/FiraSansCondensed-SemiBold.ttf);font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:830px;overflow:hidden}
body{font-family:Fira,sans-serif;position:relative;
 background:
  radial-gradient(ellipse 700px 460px at 980px 420px, rgba(150,70,230,.20), transparent 70%),
  radial-gradient(ellipse 600px 420px at 200px 300px, rgba(40,200,140,.14), transparent 70%),
  linear-gradient(160deg,#141118 0%,#0d0c10 55%,#120f14 100%);}
.frame{position:absolute;inset:10px;border:2px solid #8a6d2b;border-radius:3px;box-shadow:inset 0 0 0 1px #2a2110, inset 0 0 60px rgba(0,0,0,.6)}
.grid{position:absolute;left:30px;top:30px;display:grid;grid-template-columns:600px 600px;gap:20px}
.shot{position:relative;width:600px;height:375px;border:3px solid #b8923a;box-shadow:0 10px 30px rgba(0,0,0,.7),0 0 0 1px #000;border-radius:2px;overflow:hidden}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:12px;bottom:12px;font-size:19px;font-weight:600;padding:4px 12px;border-radius:3px;background:rgba(20,17,12,.92);border:1px solid #8a6d2b;color:#ffd23f;letter-spacing:.5px}
</style></head><body>
<div class="frame"></div>
<div class="grid">
  <div class="shot"><img src="morph-dragon.jpg"><div class="tag">Black dragon</div></div>
  <div class="shot"><img src="morph-mech.jpg"><div class="tag">War machine</div></div>
  <div class="shot"><img src="morph-rider.jpg"><div class="tag">Death knight rider</div></div>
  <div class="shot"><img src="morph-horse.jpg"><div class="tag">Armoured charger</div></div>
</div>
</body></html>
